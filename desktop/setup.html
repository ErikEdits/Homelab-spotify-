<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
  <title>Homify</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: linear-gradient(180deg, #2a2a2a 0%, #000 100%); color: #fff;
      font: 14px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    .card { width: min(480px, 100%); background: #121212; border-radius: 12px; padding: 36px 32px; }
    .logo { width: 56px; height: 56px; margin: 0 auto 12px; display: block; }
    h1 { font-size: 24px; text-align: center; margin: 0 0 8px; letter-spacing: -.02em; }
    p.hint { color: #b3b3b3; text-align: center; margin: 0 0 24px; }
    label { display: grid; gap: 6px; font-weight: 700; font-size: 13px; margin-bottom: 16px; }
    label small { font-weight: 400; color: #7a7a7a; }
    input { width: 100%; background: #2a2a2a; border: 1px solid transparent; border-radius: 6px; padding: 11px 12px;
      color: #fff; font: inherit; outline: none; }
    input:focus { border-color: #fff; background: #3e3e3e; }
    .row { display: flex; gap: 8px; }
    button { flex: 1; height: 44px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { background: #1ed760; color: #000; }
    .primary:hover { background: #3be477; }
    .secondary { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px #7a7a7a; }
    .status { min-height: 1.5em; margin: 4px 0 16px; color: #b3b3b3; }
    .status.error { color: #f3727f; }
    .status.ok { color: #1ed760; }
    .loading { text-align: center; }
    .spinner { width: 36px; height: 36px; border: 3px solid rgba(255,255,255,.15); border-top-color: #1ed760;
      border-radius: 50%; animation: spin .8s linear infinite; margin: 24px auto; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tip { color: #7a7a7a; font-size: 12px; margin-top: 20px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <circle cx="24" cy="24" r="24" fill="#1ed760"/>
      <path d="M12 24.5 24 14l12 10.5V35H28v-7h-8v7h-8z" fill="#000"/>
      <path d="M30.5 12.5c2.8 1.3 4.9 3.5 6 6.3M29 16.2c1.7.8 3 2.1 3.7 3.8" stroke="#000" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </svg>

    <div id="connecting" class="loading" hidden>
      <h1>Verbinde mit Homify …</h1>
      <div class="spinner"></div>
    </div>

    <form id="form" hidden>
      <h1 id="title">Mit deinem Homify-Server verbinden</h1>
      <p class="hint">Die Adresse steht in Homify unter Einstellungen → Apps.</p>
      <label>Server-Adresse (Heimnetz)
        <input id="primary" placeholder="http://192.168.1.20:8484" autocomplete="off" spellcheck="false">
      </label>
      <label>Adresse für unterwegs <small>(optional, Tailscale: https://…ts.net)</small>
        <input id="fallback" placeholder="https://homeserver.tailxxxx.ts.net" autocomplete="off" spellcheck="false">
      </label>
      <div id="status" class="status" role="status"></div>
      <div class="row">
        <button type="button" class="secondary" id="test">Verbindung testen</button>
        <button type="submit" class="primary" id="save">Verbinden</button>
      </div>
      <p class="tip">Unterwegs verbindet sich die App automatisch über die zweite Adresse, sobald Tailscale an ist.</p>
    </form>
  </div>
  <script src="setup.js"></script>
</body>
</html>
